name: 缺陷报告
description: 报告可复现的功能、兼容性或体验问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。若问题可能导致扬声器误播、凭据或隐私数据泄露，请不要公开提交，改用 Security 页面的私下漏洞报告。
  - type: input
    id: version
    attributes:
      label: HushWake 版本
      placeholder: 例如 0.3.3-beta / commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 只写 Android 版本、手机品牌/系列和耳机大类；不要写蓝牙名称、地址或稳定设备标识。
      placeholder: 例如 Android 15 / Pixel 系列 / 蓝牙 A2DP 耳机
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏证据
      description: 可粘贴粗粒度诊断摘要或截图；请先移除精确作息、设备名称、地址和其他个人信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认内容不含凭据、蓝牙名称/MAC 地址、精确作息或稳定设备标识。
          required: true
        - label: 我没有通过放宽耳机路由检查来规避问题。
          required: true
