<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>悄醒 · 朋友圈宣传图</title>
  <style>
    :root {
      --ink: #080d14;
      --cream: #fff0c7;
      --amber: #ffb34d;
      --mint: #57dac9;
      --white: #f8fafc;
      --muted: #aeb9c8;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      font-family: "DengXian", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    .poster {
      position: relative;
      isolation: isolate;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: var(--white);
      background: var(--ink) url("./hushwake-moments-keyvisual-v1.png") center / cover no-repeat;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(4, 8, 14, .18) 0%, rgba(4, 8, 14, .04) 42%, rgba(4, 8, 14, .35) 72%, rgba(4, 8, 14, .94) 100%),
        linear-gradient(90deg, rgba(4, 8, 14, .68) 0%, rgba(4, 8, 14, .20) 51%, rgba(4, 8, 14, 0) 79%);
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: .13;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
    }

    .topbar {
      position: absolute;
      top: 70px;
      left: 72px;
      right: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .logo-shell {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 240, 199, .18);
      border-radius: 25px;
      background: rgba(8, 13, 20, .78);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .28);
      backdrop-filter: blur(18px);
    }

    .logo-shell svg { width: 78px; height: 78px; }

    .brand-cn {
      margin-bottom: 5px;
      font-size: 31px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .1em;
    }

    .brand-en {
      color: rgba(248, 250, 252, .58);
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .24em;
    }

    .edition {
      align-self: flex-start;
      margin-top: 2px;
      padding: 10px 15px 9px;
      border: 1px solid rgba(87, 218, 201, .34);
      border-radius: 999px;
      color: var(--mint);
      background: rgba(8, 13, 20, .38);
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      backdrop-filter: blur(12px);
    }

    .hero-copy {
      position: absolute;
      top: 267px;
      left: 72px;
      width: 760px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 27px;
      color: var(--amber);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .13em;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 3px;
      border-radius: 99px;
      background: var(--amber);
      box-shadow: 0 0 24px rgba(255, 179, 77, .6);
    }

    h1 {
      margin: 0;
      font-size: 90px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -.035em;
      text-shadow: 0 4px 26px rgba(0, 0, 0, .32);
    }

    h1 .accent {
      color: var(--cream);
      text-shadow: 0 0 44px rgba(255, 179, 77, .20);
    }

    .subhead {
      margin-top: 29px;
      color: rgba(248, 250, 252, .92);
      font-size: 29px;
      line-height: 1.55;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .subhead strong {
      color: var(--mint);
      font-weight: 700;
    }

    .route-note {
      margin-top: 9px;
      color: rgba(228, 235, 243, .69);
      font-size: 20px;
      line-height: 1.6;
      letter-spacing: .015em;
    }

    .bottom-card {
      position: absolute;
      left: 54px;
      right: 54px;
      bottom: 50px;
      min-height: 278px;
      padding: 32px 34px 27px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 34px;
      background:
        linear-gradient(115deg, rgba(14, 24, 39, .91), rgba(10, 17, 29, .82)),
        rgba(9, 15, 25, .82);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .06);
      backdrop-filter: blur(28px) saturate(125%);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3px 26px;
      border-bottom: 1px solid rgba(255, 255, 255, .10);
    }

    .invite {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .invite-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 18px rgba(87, 218, 201, .8);
    }

    .platform {
      color: rgba(226, 232, 240, .56);
      font-family: Arial, "Microsoft YaHei UI", sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .09em;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .feature {
      min-height: 61px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 17px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 18px;
      background: rgba(255, 255, 255, .045);
      color: rgba(245, 248, 252, .86);
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
    }

    .feature svg { flex: 0 0 auto; color: var(--amber); }
    .feature:nth-child(2) svg { color: #63c8ff; }
    .feature:nth-child(3) svg { color: var(--mint); }

    .footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 25px;
      padding: 0 3px;
    }

    .url {
      color: rgba(248, 250, 252, .83);
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 600;
      letter-spacing: .01em;
    }

    .meta {
      color: rgba(226, 232, 240, .44);
      font-size: 14px;
      line-height: 1.45;
      text-align: right;
      letter-spacing: .04em;
    }

    .rail {
      position: absolute;
      right: 25px;
      top: 430px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, .25);
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .28em;
      writing-mode: vertical-rl;
    }

    .rail::after {
      content: "";
      width: 1px;
      height: 74px;
      background: linear-gradient(var(--amber), transparent);
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="悄醒朋友圈宣传海报">
    <header class="topbar">
      <div class="brand">
        <div class="logo-shell" aria-hidden="true">
          <svg viewBox="0 0 108 108" role="img">
            <g transform="translate(10.8 10.8) scale(.8)">
              <path fill="#FFF0C7" d="M43.2,30.6H64.8C77.7,30.6 88.2,41.1 88.2,54C88.2,66.9 77.7,77.4 64.8,77.4H43.2C30.3,77.4 19.8,66.9 19.8,54C19.8,41.1 30.3,30.6 43.2,30.6Z"/>
              <path fill="#111827" d="M43.65,38.7H64.35C72.8,38.7 79.65,45.55 79.65,54C79.65,62.45 72.8,69.3 64.35,69.3H43.65C35.2,69.3 28.35,62.45 28.35,54C28.35,45.55 35.2,38.7 43.65,38.7Z"/>
              <path fill="#FFB34D" d="M40.95,51.75C43.19,51.75 45,53.56 45,55.8V60.75C45,62.99 43.19,64.8 40.95,64.8C38.71,64.8 36.9,62.99 36.9,60.75V55.8C36.9,53.56 38.71,51.75 40.95,51.75Z M54,40.95C56.24,40.95 58.05,42.76 58.05,45V60.75C58.05,62.99 56.24,64.8 54,64.8C51.76,64.8 49.95,62.99 49.95,60.75V45C49.95,42.76 51.76,40.95 54,40.95Z M67.05,46.35C69.29,46.35 71.1,48.16 71.1,50.4V60.75C71.1,62.99 69.29,64.8 67.05,64.8C64.81,64.8 63,62.99 63,60.75V50.4C63,48.16 64.81,46.35 67.05,46.35Z"/>
              <path fill="#57DAC9" d="M80.55,36C82.79,36 84.6,37.81 84.6,40.05C84.6,42.29 82.79,44.1 80.55,44.1C78.31,44.1 76.5,42.29 76.5,40.05C76.5,37.81 78.31,36 80.55,36Z"/>
            </g>
          </svg>
        </div>
        <div>
          <div class="brand-cn">悄醒</div>
          <div class="brand-en">HUSHWAKE</div>
        </div>
      </div>
      <div class="edition">0.4.7 BETA</div>
    </header>

    <section class="hero-copy">
      <div class="eyebrow">闹钟 × 助眠声 × 智能输出</div>
      <h1>把声音，<br><span class="accent">送到对的地方。</span></h1>
      <div class="subhead">一个安静、可靠、<strong>懂耳机</strong>的闹钟。</div>
      <div class="route-note">没有耳机正常外放，有耳机先验证路径。</div>
    </section>

    <div class="rail">ALARM · SLEEP · ROUTE</div>

    <section class="bottom-card">
      <div class="card-top">
        <div class="invite"><span class="invite-dot"></span>朋友测试中 · 欢迎体验</div>
        <div class="platform">ANDROID 12+ · FREE &amp; OPEN SOURCE</div>
      </div>

      <div class="features">
        <div class="feature">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="13" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M12 9v4l2.6 1.5M9 3h6M6 5 4.6 6.4M18 5l1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          精确闹钟
        </div>
        <div class="feature">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 14c2.1-4 4.1-4 6.1 0s4.1 4 6.1 0 3.2-3 3.8-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".5"/></svg>
          8 种离线原声
        </div>
        <div class="feature">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10a5 5 0 0 1 10 0v5a5 5 0 0 1-10 0v-5Z" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v3M8 19l-2 2M16 19l2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          断连先静音
        </div>
      </div>

      <footer class="footer">
        <div class="url">github.com/chenzhiyong1994/hush-wake</div>
        <div class="meta">本地运行 · 无账号<br>个人自用测试版</div>
      </footer>
    </section>
  </main>
</body>
</html>
