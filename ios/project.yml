name: HushWake
options:
  bundleIdPrefix: com.hushwake
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  HushWakeCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  HushWake:
    type: application
    platform: iOS
    sources:
      - path: HushWake
        excludes: [Info.plist]
    info:
      path: HushWake/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hushwake.app.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HushWakeCore
  HushWakeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HushWake
  HushWakeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HushWake
schemes:
  HushWake:
    build:
      targets:
        HushWake: all
    test:
      targets: [HushWakeTests, HushWakeUITests]
      gatherCoverageData: true
